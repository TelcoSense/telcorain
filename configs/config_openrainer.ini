# Dedicated config for the OpenRainER (Italy) dataset
# global settings
[time]
step=15
output_step=15
start=2021-01-01T00:00:00
end=2021-01-01T23:59:00

[setting]
repetition_interval=600
sleep_interval=30
output_json_info=True
write_influx_intensities=False
dry_as_nan=False

[logging]
init_level=INFO

[directories]
logs=./logs
outputs=outputs_openrainer
outputs_web=outputs_web_openrainer
outputs_raw=outputs_raw_openrainer
outputs_json=outputs_json_openrainer
outputs_sum=outputs_sum_openrainer
outputs_sum_json=outputs_sum_json_openrainer
outputs_reference_web=outputs_reference_web_openrainer
outputs_reference_json=outputs_reference_json_openrainer
clean_web=False
clean_raw=False
save_web=True
save_raw=False

[hour_sum]
enabled=False
window_minutes=60
write_influx_sum=False

[cml]
min_length=0.5
max_length=100
exclude_cmls=True

[historic]
compensate_historic=True
flush_every_timesteps=0

[data_source]
mode=openrainer_tar ; monthly tarred NetCDF CML data with optional reference exports
dataset_path=F:\_mikrovlny\open_datasets\OpenRainER ; path to the OpenRainER dataset directory
export_cml_metadata_json=True
cml_metadata_json_filename=cml_metadata_openrainer.json
export_rain_event_summary_csv=True
rain_event_summary_filename=rain_event_summary_openrainer.csv
auto_adjust_region=False ; stable Emilia-Romagna framing
region_padding_deg=0.0
openrainer_cml_archive=CML.tar
openrainer_reference_source=radadj ; radadj is the gauge-adjusted 15 min radar rain map
openrainer_export_reference_pngs=True
openrainer_reference_manifest_filename=openrainer_reference_manifest.json

[wet_dry]
is_mlp_enabled=False
cnn_model=ours
cnn_model_name=cnn_v22_ds_cz_param_2025-05-15_22
rolling_hours=1.0
rolling_values=10
wet_dry_deviation=0.8
is_window_centered=False
baseline_samples=5
ignore_dry_links=False 

[waa]
waa_method=pastorek
waa_schleiss_val=2.2
waa_schleiss_tau=15

[interp]
interp_res=0.025
idw_power=2
idw_near=12
idw_dist=0.4
use_mercator=True
grid_step_m=1000.0
idw_chunk_rows=128
idw_dist_m=20000.0

[raingrids]
min_rain_value=0.1
overall_intensity_ref=20 
overall_intensity_method=coverage ; mean / p90 / p95 or coverage_strength / coverage
overall_intensity_threshold=0
overall_intensity_min_if_any_link=0.001
overall_intensity_coverage_gamma=0.3 ; sensitivity tuning (lower = more sensitive near 0)
overall_intensity_strength_gamma=1.0

[temp]
is_temp_filtered=False
is_temp_compensated=False
correlation_threshold=0.7

[limits]
x_min=8.5
x_max=13.2058
y_min=43.4
y_max=46.001

[rendering]
is_crop_enabled=True
geojson_file=it.json
