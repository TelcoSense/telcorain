# Dedicated config for the bundled pycomlink example dataset
[time]
step=10
output_step=10
start=2018-05-10T00:00:00
end=2018-05-20T23:59:00

[setting]
repetition_interval=600
sleep_interval=30
output_json_info=True
write_influx_intensities=False
dry_as_nan=False

[logging]
init_level=INFO

[directories]
logs=./logs
outputs=outputs_example
outputs_web=outputs_web_example
outputs_raw=outputs_raw_example
outputs_json=outputs_json_example
outputs_sum=outputs_sum_example
outputs_sum_json=outputs_sum_json_example
clean_web=False
clean_raw=False
save_web=True
save_raw=False

[hour_sum]
enabled=True
window_minutes=60
write_influx_sum=False

# computation settings
[cml]
min_length=0.5
max_length=100
exclude_cmls=False

[historic]
compensate_historic=True
flush_every_timesteps=0

[data_source]
mode=pycomlink_example ; bundled example dataset shipped with pycomlink
dataset_path=
export_cml_metadata_json=True
cml_metadata_json_filename=cml_metadata_example.json
export_rain_event_summary_csv=False
rain_event_summary_filename=rain_event_summary_example.csv
auto_adjust_region=False ; use a fixed bbox for stable framing of the bundled example dataset
region_padding_deg=0.0

[wet_dry]
is_mlp_enabled=False
cnn_model=ours
cnn_model_name=cnn_v22_ds_cz_param_2025-05-15_22
rolling_hours=1.0
rolling_values=10
wet_dry_deviation=0.8
is_window_centered=False
baseline_samples=5
ignore_dry_links=False 

[waa]
waa_method=pastorek
waa_schleiss_val=2.2
waa_schleiss_tau=15

[interp]
interp_res=0.025
idw_power=2
idw_near=12
idw_dist=0.4
use_mercator=True
grid_step_m=1000.0
idw_chunk_rows=128
idw_dist_m=20000.0

[raingrids]
min_rain_value=0.1
overall_intensity_ref=20 
overall_intensity_method=coverage ; mean / p90 / p95 or coverage_strength / coverage
overall_intensity_threshold=0
overall_intensity_min_if_any_link=0.001
overall_intensity_coverage_gamma=0.3 ; sensitivity tuning (lower = more sensitive near 0)
overall_intensity_strength_gamma=1.0

[temp]
is_temp_filtered=False
is_temp_compensated=False
correlation_threshold=0.7

[limits]
x_min=1.275260
x_max=4.064600
y_min=56.933800
y_max=58.422400

[rendering]
is_crop_enabled=False
geojson_file=pycomlink_example_region.geojson
